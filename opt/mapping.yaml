locked_paths:
  - 'i18n/ngqgis_ru.ts'
  - 'images/icons/qgis-icon-16x16.png'
  - 'images/icons/qgis-icon.png'
  - 'images/splash/splash.png'
  - 'resources/fonts/readme.md'
  - 'resources/ngqgis.desktop.in'
  - 'src/app/ngcustomization.cpp'
  - 'src/app/ngcustomization.h'
  - 'src/app/ngsaboutdialog.cpp'
  - 'src/app/ngsaboutdialog.h'
  - 'src/app/ngui_defaults.h'
  - 'src/app/ngupdater.cpp'
  - 'src/app/ngupdater.h'
  - 'src/app/options/ngauthoptions.cpp'
  - 'src/app/options/ngauthoptions.h'
  - 'src/auth/nextgis/**/*'
  - 'src/core/auth/ngauthmanager.cpp'
  - 'src/core/auth/ngauthmanager.h'
  - 'src/ui/ngauthoptions.ui'
  - 'src/ui/ngsaboutdialog.ui'

  # Generated files
  - 'src/analysis/flex_qgsrastercalclexer.cpp'
  - 'src/analysis/qgsrastercalcparser.cpp'
  - 'src/analysis/qgsrastercalcparser.hpp'
  - 'src/core/flex_qgsexpressionlexer.cpp'
  - 'src/core/flex_qgsmeshcalclexer.cpp'
  - 'src/core/flex_qgssqlstatementlexer.cpp'
  - 'src/core/qgsexpressionparser.cpp'
  - 'src/core/qgsexpressionparser.hpp'
  - 'src/core/qgsmeshcalcparser.cpp'
  - 'src/core/qgsmeshcalcparser.hpp'
  - 'src/core/qgssqlstatementparser.cpp'
  - 'src/core/qgssqlstatementparser.hpp'

rules:
- source: .
  destination: doc
  include:
  - '*.1'
- source: cmake_templates
  include:
  - qgsconfig.h.in
- source: doc
  include:
  - CONTRIBUTORS
  - DONORS
  - LICENSE
  - NEWS.html
  - SPONSORS
  - TRANSLATORS
- source: external/delaunator-cpp
  include:
  - '*.hpp'
- source: external/meshOptimizer
  include:
  - '*.cpp'
  - '*.h'
- source: external/nlohmann
  include:
  - '**/*.hpp'
- source: external/opencl-clhpp
  include:
  - '**/*'
- source: external/poly2tri
  include:
  - '**/*.c'
  - '**/*.cc'
  - '**/*.cpp'
  - '**/*.h'
  - '**/*.hpp'
- source: external/qt-unix-signals
  include:
  - '*.cpp'
  - '*.h'
- source: external/rtree/include
  include:
  - '*.h'
- source: external/wintoast/src
- source: i18n
  include:
  - '*.ts'
- source: images
  include:
  - '**/*'
  exclude:
  - 'README-md/**/*'
  - 'icons/qgis-full.png'
  - 'icons/qgis-icon*'
  - 'icons/qgis_icon.*'
  - 'icons/sponsor_medals/**/*'
  - 'icons/mac/**/*'
  - 'splash/**/*'
  - 'themes/default/nextgis.svg'
  - 'themes/default/mActionHelpAbout.svg'
- source: python
  include:
  - '**/*'
  exclude:
  - "**/CMakeLists.txt"
  - "core/auto_generated/dxf/*"
  - "core/auto_generated/externalstorage/*"
  - "core/auto_generated/gps/*"
  - "core/auto_generated/providers/arcgis/*"
  - "core/auto_generated/vectortile/*"
  - "gui/auto_generated/history/*"
  - "gui/auto_generated/vectortile/*"
  - "plugins/MetaSearch/**/*"
  - "plugins/db_manager/**/*"
  - "plugins/grassprovider/**/*"
  - "plugins/otbprovider/**/*"
  - "plugins/processing/tests/testdata/expected/gdal34/*"
  - "plugins/processing/tests/testdata/expected/geos39/*"
  - "plugins/processing/tests/testdata/expected/qt515/*"
  - "server/**/*"
- source: resources
  include:
  - '**/*'
  exclude:
  - "**/CMakeLists.txt"
  - 'fonts/openfonts/**/*'
  - 'fonts/topofonts/**/*'
  - 'cpt-city-qgis-min/**/*'
  - 'server/**/*'
- source: resources/cpt-city-qgis-min
  include:
  - '**/*'
  exclude:
  - ds/fuschia/*
  - ds/icons/*
  - es/autumn/*
  - es/candide/*
  - es/chic/*
  - es/coffee/*
  - es/ocean_breeze/*
  - es/pink_splash/*
  - es/rivendell/*
  - es/vintage/*
  - gacruxa/**/*
  - go2/button/*
  - go2/ipod/*
  - jjg/cbac/seq/*
  - jjg/cbcont/seq/*
  - jjg/ccolo/**/*
  - jjg/hatch/*
  - jjg/haxbyish/*
  - jjg/neo10/**/*
  - jjg/serrate/**/*
  - pd/art/*
  - pd/astro/*
  - pd/flowers/*
  - pd/skies/*
  - ukmo/main/*
  - wkp/*
  - wkp/gay-flag/*
  - wkp/life/*
  - wkp/mars/*
  - wkp/stat/*
  - wkp/strat/*
- source: scripts
  include:
  - process_function_template.py
- source: src
  include:
  - '**/*'
  exclude:
  - '**/CMakeLists.txt'
  - 'app/dwg/**/*'
  - 'app/gps/**/*'
  - 'app/qgis.ico'
  - 'auth/oauth2/oauth2_config_samples/**/*'
  - 'core/dxf/**/*'
  - 'core/gps/**/*'
  - 'core/providers/copc/**/*'
  - 'crashhandler/**/*'
  - 'customwidgets/**/*'
  - 'gui/history/**/*'
  - 'plugins/grass/**/*'
  - 'plugins/offline_editing/**/*'
  - 'providers/grass/**/*'
  - 'providers/hana/**/*'
  - 'providers/oracle/ocispatial/**/*'
  - 'quickgui/**/*'
  - 'server/**/*'
- source: tests/src
  include:
  - '**/*'
  exclude:
  - 'providers/grass/**/*'
  - 'server/**/*'
  - 'quickgui/**/*'
- source: tests/testdata
  include:
  - '**/*'
- source: tests/testdata/control_images/composer_3d/expected_composer3d_basic
- source: tests/testdata/control_images/qgssimplemarkertest
- source: tests/testdata/control_images/qgssimplemarkertest/expected_field_based
